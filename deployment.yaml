apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flaskdemo
  name: flaskdemo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flaskdemo
  template:
    metadata:
      labels:
        app: flaskdemo
    spec:
      containers:
      - image: 02042025/dockerhub:12
        name: flaskdemo
        ports:
          - containerPort: 5000  # ✅ Added

---
apiVersion: v1
kind: Service
metadata:
  name: lb-service
  labels:
    app: lb-service
spec:
  type: LoadBalancer
  ports:
  - port: 5000  # ✅ Ensure this matches Flask app
    targetPort: 5000
  selector:
    app: flaskdemo  # ✅ Fixed syntax (removed comma)
